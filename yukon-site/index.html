<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06121E">
<title>YUKON</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--navy:#06121E;--brand:#0B7FC1;--sky:#7FC4E8;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--navy);color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.gate{position:relative;min-height:100svh;display:grid;place-items:center;padding:24px;isolation:isolate;overflow:hidden}
.aur{position:absolute;inset:-20%;z-index:-1;filter:blur(70px);opacity:.8}
.aur i{position:absolute;border-radius:50%;animation:dr 14s ease-in-out infinite alternate}
.aur i:nth-child(1){width:60vmax;height:30vmax;left:-10%;top:5%;background:radial-gradient(closest-side,rgba(61,245,176,.42),transparent)}
.aur i:nth-child(2){width:55vmax;height:28vmax;right:-10%;top:25%;background:radial-gradient(closest-side,rgba(11,127,193,.65),transparent);animation-delay:-6s}
.aur i:nth-child(3){width:50vmax;height:25vmax;left:20%;bottom:-10%;background:radial-gradient(closest-side,rgba(46,107,216,.45),transparent);animation-delay:-3s}
@keyframes dr{from{transform:translate3d(-6%,-4%,0) scale(1)}to{transform:translate3d(8%,6%,0) scale(1.15)}}
.box{width:min(560px,100%);text-align:center;animation:in 1.2s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(26px)}}
.mtn{width:60px;height:60px;margin:0 auto 20px;display:block;border-radius:16px}
.eyebrow{margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:.44em;color:var(--sky)}
h1{margin:0 0 34px;font-size:clamp(72px,19vw,168px);font-weight:900;letter-spacing:-.05em;line-height:.88}
form{display:flex;flex-direction:column;gap:12px}
label{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#9DB3C6;text-align:left;padding-left:22px}
.field{display:flex;gap:10px;align-items:center;padding:7px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:border-color .3s,box-shadow .3s}
.field:focus-within{border-color:var(--sky);box-shadow:0 0 0 4px rgba(127,196,232,.18)}
input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:18px;padding:12px 8px 12px 20px;letter-spacing:.12em}
button{flex:none;display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:14px 24px;background:var(--brand);color:#fff;font:inherit;font-weight:700;font-size:13px;letter-spacing:.1em;cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s}
button:hover{transform:translateX(2px);box-shadow:0 12px 30px -10px var(--brand)}
button:disabled{opacity:.6;cursor:wait}
button svg{width:16px;height:16px}
.err{min-height:22px;margin:0;font-size:14px;color:#FF8A7E;opacity:0;transition:opacity .3s}
.err.on{opacity:1}
.shake{animation:sh .45s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="gate" id="gate">
  <div class="aur" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="box">
    <img class="mtn" src="favicon.svg" alt="" width="60" height="60">
    <p class="eyebrow">CANADA</p>
    <h1>YUKON</h1>
    <form id="f" autocomplete="off">
      <label for="pw">Password</label>
      <div class="field" id="field">
        <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required autofocus>
        <button id="go" type="submit">ENTER <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <p class="err" id="err" role="alert"></p>
    </form>
  </div>
</main>
